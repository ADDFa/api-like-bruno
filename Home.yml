info:
  name: Home
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Home
    request:
      url: https://api-ekinerja.test:8443
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Tue, 26 May 2026 04:57:27 GMT
        - name: set-cookie
          value: XSRF-%3D; expires=Tue, 26 May 2026 06:57:27 GMT; Max-Age=7200; path=/; secure; samesite=lax,api-e-kinerja-%3D; expires=Tue, 26 May 2026 06:57:27 GMT; Max-Age=7200; path=/; secure; httponly; samesite=lax
      body:
        type: json
        data: |-
          {
            "info": {
              "laravel_version": "13.8.0",
              "app_name": "API E-Kinerja",
              "app_version": "1.0.0",
              "timezone": "UTC",
              "timestamp": "2026-05-26 04:57:27",
              "user_timestamp": "2026-05-26 04:57:27"
            }
          }
