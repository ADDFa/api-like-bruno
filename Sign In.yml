info:
  name: Sign In
  type: http
  seq: 6

http:
  method: POST
  url: "{{api_url}}/sign-in"
  body:
    type: form-urlencoded
    data:
      - name: username
        value: "{{process.env.USERNAME}}"
      - name: password
        value: "{{process.env.PASSWORD}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const data = res.getBody()
          bru.setVar("access_token", data.access_token)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Sign In
    request:
      url: "{{process.env.BASE_URL}}/sign-in"
      method: POST
      body:
        type: form-urlencoded
        data:
          - name: username
            value: addfa
          - name: password
            value: password
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
