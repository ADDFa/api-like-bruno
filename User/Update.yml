  url: "{{api_url}}/user/{{user_id}}"
  body:
    type: form-urlencoded
    data:
      - name: asn_id
        value: ""
        disabled: true
      - name: nama
        value: User 1 Update
      - name: email
        value: user1update@gmail.com
      - name: username
        value: user1update
      - name: password
        value: User1.123
      - name: password_confirmation
