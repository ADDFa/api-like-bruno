info:
  name: Update My Account
  type: http
  seq: 2

http:
  method: PUT
  url: "{{api_url}}/my-account"
  body:
    type: form-urlencoded
    data:
      - name: nama
        value: Adha Update
      - name: username
        value: addfa
      - name: email
        value: addfa.update@email.com
      - name: password
        value: "{{process.env.PASSWORD_NEW}}"
      - name: password_confirmation
        value: "{{process.env.PASSWORD_NEW}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
