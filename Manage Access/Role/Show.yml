info:
  name: Show
  type: http
  seq: 2

http:
  method: GET
  url: "{{api_url}}/role/{{role_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Detail Role
    request:
      url: "{{process.env.BASE_URL}}/role/{{role_id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Mon, 13 Apr 2026 15:56:49 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "role_id": "019d863a-1623-7190-8d54-1d71fe8c15ca",
            "name": "employee",
            "name_title": "Employee"
          }
