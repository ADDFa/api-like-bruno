info:
  name: List
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}/user-permission/{{user_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Daftar Extra Permission User
    request:
      url: "{{process.env.BASE_URL}}/user-permission/{{user_id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Tue, 26 May 2026 04:59:55 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "56"
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          [
            {
              "permission_id": "019e6296-1be4-73b8-a891-81586728ffbc",
              "name": "create-user",
              "name_title": "Create User"
            }
          ]
