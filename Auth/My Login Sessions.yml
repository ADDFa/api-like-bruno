info:
  name: My Login Sessions
  type: http
  seq: 5

http:
  method: GET
  url: "{{api_url}}/device-connected?page=1&per_page=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Pengguna biasa melihat sesi aktif miliknya, urut dari login terbaru.
    Super-admin yang tidak mengirim `user_id` akan melihat semua sesi aktif. Untuk membatasi ke sesi sendiri atau pengguna tertentu, gunakan "User Login Sessions" dengan `user_id` yang sesuai.
    `user`, `device`, `ip_address`, waktu login (`created_at`), waktu pembaruan (`updated_at`), dan masa berlaku (`expired_at`) tersedia di tiap baris. `is_current` bernilai `true` hanya bila cookie refresh perangkat ini cocok dengan sesi.
    Respons memakai pagination Laravel; contoh di bawah menampilkan field utama. Nilai ID dan waktu hanya ilustrasi.

examples:
  - name: My Login Sessions
    request:
      url: "{{api_url}}/device-connected?page=1&per_page=10"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "current_page": 1,
            "data": [
              {
                "id": "01J00000000000000000000000",
                "user_id": "11111111-1111-4111-8111-111111111111",
                "user": {
                  "id": "11111111-1111-4111-8111-111111111111",
                  "name": "Contoh Pengguna",
                  "username": "contoh",
                  "email": "contoh@example.test"
                },
                "device": "Chrome",
                "ip_address": "192.0.2.10",
                "created_at": "2026-11-06T08:00:00.000000Z",
                "updated_at": "2026-11-06T08:00:00.000000Z",
                "expired_at": "2026-11-20T08:00:00.000000Z",
                "is_current": false
              }
            ],
            "from": 1,
            "last_page": 1,
            "per_page": 10,
            "to": 1,
            "total": 1
          }
