info:
  name: Sign Out All My Sessions
  type: http
  seq: 4

http:
  method: POST
  url: "{{api_url}}/sign-out-all-device"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Mencabut seluruh sesi milik pengguna yang sedang login. Tidak memerlukan body.
    Respons `data.revoked_count` menunjukkan jumlah baris `user_tokens` yang dihapus. Cookie `refresh_token` milik perangkat ini dihapus.
    Bearer token yang sudah terbit pada perangkat lain masih dapat dipakai sampai masa berlakunya habis.

examples:
  - name: Sign Out All My Sessions
    request:
      url: "{{api_url}}/sign-out-all-device"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "is_success": true,
            "data": {
              "revoked_count": 2
            }
          }
