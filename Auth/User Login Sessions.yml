info:
  name: User Login Sessions
  type: http
  seq: 7

http:
  method: GET
  url: "{{api_url}}/device-connected?user_id={{session_user_id}}&page=1&per_page=10"
  params:
    - name: user_id
      value: "{{session_user_id}}"
      type: query
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Menampilkan seluruh sesi aktif milik `user_id` (UUID) secara berpaginasi, urut dari sesi terbaru.
    Super-admin dapat memilih pengguna mana pun. Pengguna biasa hanya dapat memakai ID miliknya; ID pengguna lain menghasilkan HTTP 403.
    Isi variabel folder Auth `session_user_id` sebelum menjalankan permintaan. Respons dan field sesi sama seperti "My Login Sessions". `refresh_token` tidak dikirim.

examples:
  - name: User Login Sessions
    request:
      url: "{{api_url}}/device-connected?user_id={{session_user_id}}&page=1&per_page=10"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "current_page": 1,
            "data": [
              {
                "id": "01J00000000000000000000000",
                "user_id": "11111111-1111-4111-8111-111111111111",
                "user": {
                  "id": "11111111-1111-4111-8111-111111111111",
                  "name": "Contoh Pengguna",
                  "username": "contoh",
                  "email": "contoh@example.test"
                },
                "device": "Chrome",
                "ip_address": "192.0.2.10",
                "created_at": "2026-11-06T08:00:00.000000Z",
                "updated_at": "2026-11-06T08:00:00.000000Z",
                "expired_at": "2026-11-20T08:00:00.000000Z",
                "is_current": false
              }
            ],
            "from": 1,
            "last_page": 1,
            "per_page": 10,
            "to": 1,
            "total": 1
          }
