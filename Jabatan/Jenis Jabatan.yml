info:
  name: Jenis Jabatan
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}/jenis-jabatan"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Data Jenis Jabatan
    request:
      url: "{{api_url}}/jenis-jabatan"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 16 Sep 2026 03:08:12 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "58"
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "nama": "Jabatan Struktural"
            },
            {
              "id": 2,
              "nama": "Jabatan Fungsional Tertentu"
            },
            {
              "id": 4,
              "nama": "Jabatan Fungsional Umum"
            }
          ]
