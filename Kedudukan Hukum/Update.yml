  url: "{{api_url}}/kedudukan-hukum/{{kedudukan_hukum_id}}"
  body:
    type: form-urlencoded
    data:
      - name: nama
        value: Coba Update
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Update Kedudukan Hukum
    request:
      url: "{{api_url}}/kedudukan-hukum/{{kedudukan_hukum_id}}"
      method: PUT
      body:
        type: form-urlencoded
        data:
          - name: nama
            value: Coba Update
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
