info:
  name: Hapus Kedudukan Hukum
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{api_url}}/kedudukan-hukum/{{kedudukan_hukum_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Hapus Kedudukan Hukum
    request:
      url: "{{api_url}}/kedudukan-hukum/{{kedudukan_hukum_id}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Tue, 14 Jul 2026 09:48:19 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "59"
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          {
            "is_success": true,
            "data": {
              "id": "02",
              "nama": "CLTN"
            }
          }
