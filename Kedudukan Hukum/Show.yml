info:
  name: Show
  type: http
  seq: 2

http:
  method: GET
  url: "{{api_url}}/kedudukan-hukum/{{kedudukan_hukum_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Detail Kedudukan Hukum
    request:
      url: "{{api_url}}/kedudukan-hukum/{{kedudukan_hukum_id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Tue, 14 Jul 2026 09:43:03 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "58"
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          {
            "id": "102",
            "nama": "Coba"
          }
