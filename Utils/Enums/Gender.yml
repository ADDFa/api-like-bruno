info:
  name: Gender
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}/{{prefix}}/gender"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Data Gender
    request:
      url: "{{api_url}}/{{prefix}}/gender"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Thu, 09 Jul 2026 16:05:57 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "59"
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          [
            {
              "label": "Female",
              "value": "F"
            },
            {
              "label": "Male",
              "value": "M"
            }
          ]
