info:
  name: Jenis Mutasi
  type: http
  seq: 8

http:
  method: GET
  url: "{{api_url}}/{{prefix}}/jenis-mutasi"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Data Jenis Mutasi
    request:
      url: "{{api_url}}/{{prefix}}/jenis-mutasi"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Tue, 15 Sep 2026 08:35:11 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "59"
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          [
            {
              "label": "Mutasi Jabatan",
              "value": "MJ"
            },
            {
              "label": "Mutasi Unor",
              "value": "MU"
            }
          ]
