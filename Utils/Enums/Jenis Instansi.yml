info:
  name: Jenis Instansi
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_url}}/{{prefix}}/jenis-instansi"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Data Jenis Instansi
    request:
      url: "{{api_url}}/{{prefix}}/jenis-instansi"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.3
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: x-powered-by
          value: PHP/8.3.16
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Thu, 09 Jul 2026 16:11:23 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "58"
        - name: vary
          value: Origin
      body:
        type: json
        data: |-
          [
            {
              "label": "Pusat",
              "value": "P"
            },
            {
              "label": "Daerah",
              "value": "D"
            }
          ]
